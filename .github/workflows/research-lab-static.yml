name: research-lab-static-receipt
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-stack regression fixtures
        run: |
          python3 scripts/regression_fixtures.py
          python3 scripts/secret_boundary.py

      - name: Launch actual Research Forge front door
        run: |
          bash run.sh
          curl -fsS http://127.0.0.1:8877/api/status > /tmp/status.json
          curl -fsS http://127.0.0.1:8877/api/titans > /tmp/titans.json
          python3 - <<'PY'
          import json
          status=json.load(open('/tmp/status.json'))
          titans=json.load(open('/tmp/titans.json'))
          assert status['service']=='lokivelli-research-forge'
          assert status['keyless_public_mode'] is True
          assert len(titans['seats']) == 4
          assert [s['id'] for s in titans['seats'][:3]] == ['titan-1','titan-2','titan-3']
          print('RUNTIME CONTRACT PASS')
          PY

      - name: Static donor surface regression
        run: |
          curl -fsS http://127.0.0.1:8877/ >/tmp/root.html
          curl -fsS http://127.0.0.1:8877/apps/throat/index.html >/tmp/throat.html
          curl -fsS http://127.0.0.1:8877/apps/throat-extreme/index.html >/tmp/extreme.html
          curl -fsS http://127.0.0.1:8877/research/bulk_interference_v02/WORKBENCH.html >/tmp/workbench.html
          grep -q "FEDERATED COMMAND DECK" /tmp/root.html
          grep -q "GARGANTUA / THROAT TRANSIT" /tmp/throat.html
          grep -q "Bulk Interference / Throat Coupling v0.2" /tmp/workbench.html
          grep -q "1/(6π)" research/bulk_interference_v02/DERIVATION_LEDGER.md
          grep -q "1/(3π)" research/bulk_interference_v02/DERIVATION_LEDGER.md

      - name: Public package + receipts
        run: |
          python3 scripts/package_public_release.py
          sha256sum             index.html             apps/throat/index.html             apps/throat-extreme/index.html             research/bulk_interference_v02/WORKBENCH.html             research/bulk_interference_v02/DERIVATION_LEDGER.md             config/services.json             config/titans.public.json             forge_server.py             verify.sh             > BUILD_RECEIPT.sha256
          cat BUILD_RECEIPT.sha256

      - name: Upload build receipts and installable public package
        uses: actions/upload-artifact@v4
        with:
          name: research-lab-public-build
          path: |
            BUILD_RECEIPT.sha256
            dist/Lokivelli_Research_Forge_PUBLIC_0.2.0_20261114.zip
            dist/Lokivelli_Research_Forge_PUBLIC_0.2.0_20261114.zip.sha256
            dist/Lokivelli_Research_Forge_PUBLIC_0.2.0_20261114.SHA256_MANIFEST.json
